[build-system]
requires = [
  "setuptools>=61",
  "wheel",
  "setuptools_scm[toml]>=7"
]
build-backend = "setuptools.build_meta"

[project]
name = "kiwi-scan"
dynamic = ["version"]
description = "A modular scanning framework with YAML-configured actuators, monitors, triggers, plugins, and scan strategies."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
  { name = "Helmholtz-Zentrum Berlin" }
]
keywords = [
  "epics",
  "scientific",
  "instrumentation",
  "beamline",
  "control-system",
  "data-acquisition",
  "scan",
  "automation",
  "yaml",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Physics",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Topic :: Software Development :: Libraries",
  "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
  "numpy>=1.24",
  "PyYAML>=6.0",
  "pyepics>=3.5",
  "pandas",
  "matplotlib",
]

[project.optional-dependencies] 
dev = [ "pytest", "pytest-cov", "pyright", "caproto[complete]", "jinja2", "pylint", "ruff", "bandit" ]
ioc = [ "softioc", "p4p" ]

[project.urls]
Homepage = "https://github.com/hz-b/kiwi-scan"
Repository = "https://github.com/hz-b/kiwi-scan"
Issues = "https://github.com/hz-b/kiwi-scan/issues"

[project.scripts] # TODO: standardize the executable names kiwi-* etc.
scan_runner = "kiwi_scan.cli.scan_runner:main"
actuator_runner = "kiwi_scan.cli.actuator_runner:main"
scanplotter_cli = "kiwi_scan.cli.scanplotter_cli:main"
scantrigger_cli = "kiwi_scan.cli.scantrigger_cli:main"
pollstats_cli = "kiwi_scan.cli.pollstats_cli:main"
manifestfiles = "kiwi_scan.cli.manifestfiles:main"
scanioc = "kiwi_scan.cli.scanioc:main"
kiwi-pva-server = "kiwi_scan.cli.pva_server:main"
kiwi-convert = "kiwi_scan.cli.convert:main"
kiwi2spec = "kiwi_scan.cli.kiwi2spec:main"
kiwi-config-defaults = "kiwi_scan.cli.config_defaults:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]


[tool.ruff]
target-version = "py38"

[tool.ruff.lint]
ignore = [
    "FA100",  # Do not require future annotations for typing simplification
]

[tool.ruff.lint.pyupgrade]
keep-runtime-typing = true

[tool.pylint.main]
py-version = "3.11"

[tool.pylint.similarities]
min-similarity-lines = 10

[tool.pylint.messages_control]
disable = [
    "all",
]

enable = [
    ## Serious correctness problems
    "E",
    "F",

    ## API/inheritance problems
    "arguments-differ",

    ## Enable for maintainablility checks by cathegory
    "too-many-locals",
    "too-many-statements",
    "too-many-branches",
    "too-many-return-statements",
    "duplicate-code",

    ## Keep suppressions clean
    "useless-suppression",
]

[tool.pyright]
include = ["src/kiwi_scan"]
extraPaths = ["src"]
pythonVersion = "3.8"
pythonPlatform = "Linux"
typeCheckingMode = "basic"


[tool.setuptools_scm]
tag_regex = "^v?(?P<version>[0-9]+\\.[0-9]+\\.[0-9]+(?:\\+[A-Za-z0-9\\.]+)?)$"
version_scheme = "no-guess-dev"
local_scheme = "no-local-version"
fallback_version = "0.0.0"
